<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 12px/1.45 Inter, system-ui, sans-serif; margin: 0; padding: 14px; color: var(--fg, #222); }
  @media (prefers-color-scheme: dark) { body { --fg: #eee; background: #2c2c2c; } .log { background: #1e1e1e !important; } }
  h1 { font-size: 13px; margin: 0 0 10px; }
  button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid #8884; background: #0d99ff; color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  label { display: block; margin: 10px 0 2px; opacity: .8; }
  input[type=range], select, input[type=text], textarea { width: 100%; box-sizing: border-box; }
  select, input[type=text], textarea { font: inherit; padding: 6px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; }
  textarea { resize: vertical; }
  .hint { display: block; opacity: .6; margin-top: 2px; }
  .log { background: #f4f4f4; border-radius: 6px; padding: 8px; min-height: 60px; white-space: pre-wrap; }
  .err { color: #e5484d; }
  .merge { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Clusterry</h1>
  <label for="board">New board name</label>
  <input id="board" type="text" value="[clusters]" maxlength="60" spellcheck="false">
  <small class="hint">Same name updates that board · a new name creates a new page.</small>
  <label for="group">Group by</label>
  <textarea id="group" rows="3" placeholder="e.g. what each person is asking for · emotional tone · which part of the experience it concerns&#10;(empty = let themes emerge from the content)"></textarea>
  <label for="page">Page to read</label>
  <select id="page"><option value="all">All pages</option></select>
  <div class="row" style="margin-top:10px">
    <button id="run">Cluster board</button>
    <button id="reset" class="secondary" title="Forget clusters and cached embeddings, and delete the [clusters] page contents">Reset</button>
  </div>
  <label>Tightness: <span id="tv">1.00</span> <small>(higher → more, smaller clusters)</small></label>
  <input id="tight" type="range" min="0.7" max="1.3" step="0.05" value="1">
  <div class="log" id="log">Ready.</div>
  <div id="merges"></div>
  <script>/*__SCRIPT__*/</script>
</body>
</html>
